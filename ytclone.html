<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>YT Clone</title>
        <style>
            body{
                height: 3000px;
                font-family: Roboto, Arial, sans-serif;
                
            }

            .papa{
                display: grid;
                grid-template-columns: 1fr 1fr 1fr  ;
                justify-items: stretch;
                gap: 20px;
            }

            .container{
                display: flex;
                flex-direction: column;
                box-sizing: border-box;
                width: 400px;
            }

            .video-info{
                display: flex;
                flex-direction: row;
                margin-top: 20px;
            }

            .img{
                object-fit: cover;
                width: 100%;
                height: auto;
            }
            
            

            .profile-pic{
                border-radius: 50px;
                width: 55px;
                height: 55px;
                margin-right: 10px;
                background-color: gray;
            }

            .channel-name{
              color: rgb(130, 129, 129);
              font-size: 14px;
              margin-bottom: 4px;
            }

            .view-time{
                color: rgb(123, 121, 121);
                font-size: 15px;
                margin-top:4px;
                margin-bottom: 15px;
                width: 264px;
                height: 14.667px;
            }

            .vid-title{
                max-width: 350px;
                margin: 0;
                font-size: 18px;
                font-weight: 800;
                width: 100%;
            }
        </style>    
    </head>

    <body>
    <main>
        <div class="papa">
            <div class="container">
               <div class="images">
                    <img class="img" src="yt thumbnail/thumbnail-1.webp">
                </div>
                <div class="video-info">
                    <div class="side-pic">
                        <img class="profile-pic" src="yt profile picture/channel-1.jpeg">
                    </div>
                    <div class="text-vid">
                    <p class="vid-title">
                        Talking Tech and AI with Google CEO Sundar Pichai! 
                    </p>
                    <p class="channel-name">
                        Marques Brownlee
                    </p>
                    <p class="view-time">
                        3.4M &#183; 6 months ago
                    </p>
                    </div>
                </div>
            </div> 

            <div class="container">
                <div class="images">
                    <img class="img" src="yt thumbnail/thumbnail-2.webp">
                </div>
                <div class="video-info">
                    <div class="side-pic">
                        <img class="profile-pic" src="yt profile picture/channel-2.jpeg">
                    </div>
                    <div class="text-vid">
                    <p class="vid-title">
                        Talking Tech and AI with Google CEO Sundar Pichai! 
                    </p>
                    <p class="channel-name">
                        Marques Brownlee
                    </p>
                    <p class="view-time">
                        3.4M &#183; 6 months ago
                    </p>
                    </div>
                </div>
            </div>

            <div class="container">
                <div class="images">
                    <img class="img" src="yt thumbnail/thumbnail-2.webp">
                </div>
                <div class="video-info">
                    <div class="side-pic">
                        <img class="profile-pic" src="yt profile picture/channel-2.jpeg">
                    </div>
                    <div class="text-vid">
                    <p class="vid-title">
                        Talking Tech and AI with Google CEO Sundar Pichai! 
                    </p>
                    <p class="channel-name">
                        Marques Brownlee
                    </p>
                    <p class="view-time">
                        3.4M &#183; 6 months ago
                    </p>
                    </div>
                </div>
            </div>
        </div>
    </body>
    </main>
</html>
